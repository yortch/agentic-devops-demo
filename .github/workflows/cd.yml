name: CD - Deploy to Azure

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types: [completed]
    branches: [main, iac]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'banking-demo'
        type: choice
        options:
        - banking-demo
        - staging
        - production

jobs:
  deploy-azure:
    name: Deploy to Azure with azd CLI
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install azd CLI
        uses: Azure/setup-azd@v2

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure with azd (OIDC)
        run: |
          azd auth login \
            --client-id "${{ vars.AZURE_CLIENT_ID }}" \
            --federated-credential-provider "github" \
            --tenant-id "${{ vars.AZURE_TENANT_ID }}"

      - name: Configure azd environment
        run: |
          ENV_NAME="${{ inputs.environment || 'banking-demo' }}"
          azd env new "$ENV_NAME" --no-prompt
          azd env set AZURE_LOCATION "${{ vars.AZURE_LOCATION }}" --environment "$ENV_NAME"
          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}" --environment "$ENV_NAME"

      - name: Adopt existing container registry
        run: |
          ENV_NAME="${{ inputs.environment || 'banking-demo' }}"
          RESOURCE_GROUP="rg-${ENV_NAME}"
          RESOURCE_GROUP_EXISTS=$(az group exists --name "$RESOURCE_GROUP")
          if [ "$RESOURCE_GROUP_EXISTS" = "true" ]; then
            ACR_NAMES=$(az acr list --resource-group "$RESOURCE_GROUP" --query '[].name' --output tsv)
            if [ -z "$ACR_NAMES" ]; then
              echo "::error::Resource group $RESOURCE_GROUP exists but has no container registry to adopt."
              exit 1
            fi
            if [ "$(printf '%s\n' "$ACR_NAMES" | wc -l)" -ne 1 ]; then
              echo "::error::Expected exactly one container registry in $RESOURCE_GROUP; found multiple."
              exit 1
            fi
            azd env set AZURE_CONTAINER_REGISTRY_NAME "$ACR_NAMES" --environment "$ENV_NAME"
          elif [ "$RESOURCE_GROUP_EXISTS" != "false" ]; then
            echo "::error::Unable to determine whether resource group $RESOURCE_GROUP exists."
            exit 1
          fi

      - name: Provision and Deploy
        run: |
          azd up --environment ${{ inputs.environment || 'banking-demo' }} --no-prompt
        env:
          AZURE_ENV_NAME: ${{ inputs.environment || 'banking-demo' }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

      - name: Get Application URLs
        id: get-urls
        run: |
          ENV_NAME="${{ inputs.environment || 'banking-demo' }}"
          BACKEND_URL=$(azd env get-values --environment "$ENV_NAME" | grep backend_uri | cut -d'=' -f2 | tr -d '"')
          FRONTEND_URL=$(azd env get-values --environment "$ENV_NAME" | grep frontend_uri | cut -d'=' -f2 | tr -d '"')
          echo "backend-url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "frontend-url=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | $BACKEND_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | $FRONTEND_URL |" >> $GITHUB_STEP_SUMMARY
